# --- SPARK CONFIG IMPROVEMENTS FOR EXPERIMENTAL CASCADING FAULTS ---
spark.sql.streaming.metricsEnabled true
spark.ui.prometheus.enabled true
spark.executor.processTreeMetrics.enabled true
# Enable dynamic allocation for fair rebalance
spark.dynamicAllocation.enabled true
spark.dynamicAllocation.minExecutors 2
spark.dynamicAllocation.maxExecutors 4
spark.dynamicAllocation.initialExecutors 2
# Set executor instances for static allocation fallback
spark.executor.instances 2
# Enable speculation to reduce straggler impact
spark.speculation true
# Increase task failure tolerance
spark.task.maxFailures 8
# Enable backpressure for streaming stability
spark.streaming.backpressure.enabled true
# Set fair scheduler pool (if using pools)
# spark.scheduler.allocation.file /opt/spark/conf/fairscheduler.xml
spark.executor.memory 700m
spark.sql.streaming.kafka.maxOffsetsPerTrigger 500