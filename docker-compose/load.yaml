load_pattern:
  - rate: 100
    duration: 180
    description: "Baseline load"
  - rate: 300
    duration: 180
    description: "Increasing load"
  - rate: 700
    duration: 180
    description: "High load"
  - rate: 1000
    duration: 60
    description: "Burst load peak"
  - rate: 200
    duration: 300
    description: "Recovery phase"

total_duration: 900
replay_dataset: true
dataset_source: "parquet"
dataset:
  path: "../cic-collection.parquet"
  replay_mode: "loop"
  deterministic: true
kafka_topic: "cic-topic"
