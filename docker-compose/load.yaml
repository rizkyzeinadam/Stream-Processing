load_pattern:
  - rate: 100
    duration: 100
    description: "Warm-up (baseline stable)"
  - rate: 200
    duration: 200
    description: "Ramp-up"
  - rate: 300
    duration: 30
    description: "Switchover (fault t=300)"
  - rate: 700
    duration: 330
    description: "Kill + High (fault t=330)"
  - rate: 1000
    duration: 240
    description: "Restart + Peak (fault t=660)"

total_duration: 900
replay_dataset: true
dataset_source: "parquet"
dataset:
  path: "../cic-collection.parquet"
  replay_mode: "loop"
  deterministic: true
kafka_topic: "cic-topic"