jobmanager.rpc.address: jobmanager
jobmanager.rpc.port: 6123
taskmanager.rpc.port: 6124
taskmanager.numberOfTaskSlots: 1
parallelism.default: 2
jobmanager.scheduler: adaptive
cluster.evenly-spread-out-slots: true

# Memory configuration
jobmanager.memory.process.size: 448m
jobmanager.memory.jvm-metaspace.size: 96m
jobmanager.memory.jvm-overhead.min: 64m
jobmanager.memory.jvm-overhead.max: 64m
jobmanager.memory.off-heap.size: 64m
taskmanager.memory.process.size: 1024m

# Fault tolerance
state.backend: filesystem
state.checkpoints.dir: file:///tmp/flink-checkpoints
state.savepoints.dir: file:///tmp/flink-savepoints
execution.checkpointing.interval: 10s
execution.checkpointing.mode: EXACTLY_ONCE
execution.checkpointing.timeout: 600000
execution.checkpointing.max-concurrent-checkpoints: 1
taskmanager.state.local.recovery: true
restart-strategy: fixed-delay
restart-strategy.fixed-delay.attempts: 10
restart-strategy.fixed-delay.delay: 5 s

# Network
taskmanager.network.numberOfBuffers: 1024
taskmanager.network.memory.buffers.per-channel.default: 2
taskmanager.network.memory.buffers.per-channel.persistentState: 2

# Metrics
metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
metrics.reporter.prom.port: 9249
metrics.reporter.prom.interval: 5 SECONDS
metrics.scope.delimiter: _

# Recovery
jobmanager.execution.failover-strategy: region
taskmanager.registration.timeout: 5min
taskmanager.slot.timeout: 30s

# Logging
log.file: /opt/flink/log/taskmanager.log
log.file.max: 5
log.file.max-index: 5
