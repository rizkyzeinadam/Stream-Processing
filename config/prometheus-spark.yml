global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spark-master'
    static_configs:
      - targets: ['spark-master:8080']
    metrics_path: '/metrics/prometheus'

  - job_name: 'spark-worker1'
    static_configs:
      - targets: ['spark-worker1:8081']
    metrics_path: '/metrics/prometheus'

  - job_name: 'spark-worker2'
    static_configs:
      - targets: ['spark-worker2:8081']
    metrics_path: '/metrics/prometheus'

  - job_name: 'spark-app'
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: ['spark-master:9091']
    metrics_path: '/metrics'

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['spark-cadvisor:8080']
    scrape_interval: 5s
    metrics_path: /metrics

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
